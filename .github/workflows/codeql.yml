name: CodeQL Advanced

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "37 10 * * 5"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show build environment
        id: toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          echo "xcode_version=$xcode_version" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package sources
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/swift-package-sources
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('Easydict.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.toolchain.outputs.xcode_version }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build application
        run: |
          xcodebuild build \
            -workspace Easydict.xcworkspace \
            -scheme Easydict \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-package-sources" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EASYDICT_RELEASE_PACKAGING=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
