<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" role="img" aria-labelledby="title desc">
  <title id="title">ClaudeCode 服务架构</title>
  <desc id="desc">展示 ClaudeCode 翻译服务如何通过本地 claude CLI 接入 StreamService，并约束模型、工具、settings 与环境注入。</desc>
  <style>
    text {
      font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .title { fill: #111827; font-size: 24px; font-weight: 600; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .group-title { fill: #374151; font-size: 15px; font-weight: 600; }
    .box-title { fill: #111827; font-size: 15px; font-weight: 600; }
    .box-text { fill: #4b5563; font-size: 12px; }
    .label { fill: #6b7280; font-size: 12px; }
    .label-bg { fill: #ffffff; opacity: 0.96; }
    .note-title { fill: #374151; font-size: 13px; font-weight: 600; }
    .note-text { fill: #6b7280; font-size: 12px; }
    .terminal-title { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .terminal-text { fill: #d1d5db; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1120" height="720" fill="#ffffff"/>

  <text x="48" y="48" class="title">ClaudeCode 服务</text>
  <text x="48" y="72" class="subtitle">通过本地 claude CLI 接入 StreamService，默认使用 Sonnet alias，并隔离工具、MCP 与 settings hooks。</text>

  <rect x="42" y="104" width="1036" height="428" rx="10" ry="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="64" y="134" class="group-title">Easydict/Swift/Service/ClaudeCode</text>

  <rect x="72" y="192" width="152" height="86" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="148" y="225" text-anchor="middle" class="box-title">翻译请求</text>
  <text x="148" y="248" text-anchor="middle" class="box-text">StreamService 链路</text>

  <rect x="280" y="166" width="220" height="118" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390" y="199" text-anchor="middle" class="box-title">ClaudeCodeService</text>
  <text x="390" y="224" text-anchor="middle" class="box-text">组装翻译 prompt</text>
  <text x="390" y="244" text-anchor="middle" class="box-text">管理 runner 生命周期</text>
  <text x="390" y="264" text-anchor="middle" class="box-text">取消旧查询子进程</text>

  <rect x="580" y="166" width="264" height="118" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="712" y="199" text-anchor="middle" class="box-title">ClaudeCodeRunner</text>
  <text x="712" y="224" text-anchor="middle" class="box-text">定位 claude 可执行文件</text>
  <text x="712" y="244" text-anchor="middle" class="box-text">构建参数与子进程环境</text>
  <text x="712" y="264" text-anchor="middle" class="box-text">后台读取 stdout / stderr</text>

  <rect x="580" y="372" width="264" height="96" rx="8" ry="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="712" y="405" text-anchor="middle" class="terminal-title">claude CLI</text>
  <text x="712" y="430" text-anchor="middle" class="terminal-text">-p --print --verbose</text>
  <text x="712" y="450" text-anchor="middle" class="terminal-text">--output-format stream-json</text>

  <rect x="280" y="364" width="220" height="112" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390" y="398" text-anchor="middle" class="box-title">ClaudeCodeEventParser</text>
  <text x="390" y="423" text-anchor="middle" class="box-text">解析 text_delta</text>
  <text x="390" y="443" text-anchor="middle" class="box-text">解析 usage 与错误事件</text>
  <text x="390" y="463" text-anchor="middle" class="box-text">映射登录、额度和通用错误</text>

  <rect x="72" y="384" width="152" height="86" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="148" y="417" text-anchor="middle" class="box-title">翻译输出</text>
  <text x="148" y="440" text-anchor="middle" class="box-text">增量结果或错误</text>

  <path d="M224 235 H280" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M500 225 H580" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="526" y="209" width="30" height="18" rx="4" class="label-bg"/>
  <text x="541" y="222" text-anchor="middle" class="label">prompt</text>

  <path d="M712 284 V372" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="724" y="320" width="54" height="18" rx="4" class="label-bg"/>
  <text x="751" y="333" text-anchor="middle" class="label">启动进程</text>

  <path d="M580 420 H500" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="523" y="404" width="34" height="18" rx="4" class="label-bg"/>
  <text x="540" y="417" text-anchor="middle" class="label">JSONL</text>

  <path d="M280 427 H224" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="238" y="411" width="28" height="18" rx="4" class="label-bg"/>
  <text x="252" y="424" text-anchor="middle" class="label">delta</text>

  <rect x="876" y="148" width="176" height="136" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="898" y="178" class="note-title">CLI 参数契约</text>
  <text x="898" y="204" class="note-text">--model sonnet</text>
  <text x="898" y="224" class="note-text">--tools ""</text>
  <text x="898" y="244" class="note-text">--strict-mcp-config</text>
  <text x="898" y="264" class="note-text">--setting-sources ""</text>

  <path d="M844 224 H876" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#arrow-orange)"/>

  <rect x="876" y="332" width="176" height="136" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="898" y="362" class="note-title">模型边界</text>
  <text x="898" y="388" class="note-text">sonnet 是官方 alias</text>
  <text x="898" y="408" class="note-text">代表 Sonnet 系列默认值</text>
  <text x="898" y="428" class="note-text">不是固定模型 ID</text>
  <text x="898" y="448" class="note-text">空 model 时省略 --model</text>

  <path d="M844 420 H876" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#arrow-orange)"/>

  <rect x="72" y="570" width="300" height="92" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="94" y="600" class="note-title">配置来源</text>
  <text x="94" y="626" class="note-text">跳过 settings sources，避免插件 hooks。</text>
  <text x="94" y="646" class="note-text">单独注入 settings.json 的 env，保留认证与代理。</text>

  <path d="M222 570 V548 H548 V450 H580" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <rect x="432" y="570" width="280" height="92" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="454" y="600" class="note-title">调试入口</text>
  <text x="454" y="626" class="note-text">日志记录 CLI 参数、stdout/stderr 和退出码。</text>
  <text x="454" y="646" class="note-text">DebugWindow 查看原始 stream-json 事件。</text>

  <rect x="772" y="570" width="280" height="92" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="794" y="600" class="note-title">图例</text>
  <line x1="794" y1="624" x2="834" y2="624" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="846" y="628" class="note-text">请求 / 控制</text>
  <line x1="794" y1="646" x2="834" y2="646" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="846" y="650" class="note-text">事件流 / 环境</text>
  <line x1="942" y1="624" x2="982" y2="624" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="994" y="628" class="note-text">翻译增量</text>
  <line x1="942" y1="646" x2="982" y2="646" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="994" y="650" class="note-text">参数边界</text>
</svg>
