<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="title desc">
  <title id="title">MDict 架构</title>
  <desc id="desc">展示 MDict 导入、加载、逐条词条 LINK 跳转、搜索 fallback、资源缓存、交互脚本、共享 Dark Reader 运行时、MDict 样式适配和直接 HTML 渲染的主要组件与数据流。</desc>
  <style>
    text {
      font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .title { fill: #111827; font-size: 24px; font-weight: 600; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .group-title { fill: #374151; font-size: 15px; font-weight: 600; }
    .box-title { fill: #111827; font-size: 15px; font-weight: 600; }
    .box-text { fill: #4b5563; font-size: 12px; }
    .label { fill: #6b7280; font-size: 12px; }
    .lane-title { fill: #374151; font-size: 13px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="960" height="800" fill="#ffffff"/>

  <text x="48" y="48" class="title">MDict 离线词典</text>
  <text x="48" y="72" class="subtitle">导入 MDX/MDD 文件，解析索引和记录块，逐条跟随词条 LINK 跳转，读取外部 JS 资源，并生成 MDict 专用 WebView 外壳展示结果。</text>

  <rect x="40" y="104" width="880" height="520" rx="10" ry="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="62" y="134" class="group-title">Easydict/Swift/Service/Dictionary/MDict</text>

  <rect x="66" y="164" width="828" height="142" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="88" y="191" class="lane-title">导入与加载</text>

  <rect x="92" y="216" width="174" height="64" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="179" y="241" text-anchor="middle" class="box-title">配置视图</text>
  <text x="179" y="263" text-anchor="middle" class="box-text">导入类型兜底、启用、排序</text>

  <rect x="356" y="204" width="184" height="88" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="448" y="235" text-anchor="middle" class="box-title">MDictManager</text>
  <text x="448" y="260" text-anchor="middle" class="box-text">Defaults records</text>
  <text x="448" y="280" text-anchor="middle" class="box-text">in-flight 去重 + records 排序</text>

  <rect x="624" y="208" width="218" height="84" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="733" y="233" text-anchor="middle" class="box-title">MDictDictionary</text>
  <text x="733" y="255" text-anchor="middle" class="box-text">MDX reader + 懒加载 MDD</text>
  <text x="733" y="275" text-anchor="middle" class="box-text">资源重写 / HTML section</text>

  <path d="M266 248 H356" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M540 248 H624" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="66" y="344" width="828" height="164" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="88" y="371" class="lane-title">查询与渲染</text>

  <rect x="92" y="402" width="174" height="72" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="179" y="431" text-anchor="middle" class="box-title">MDictService</text>
  <text x="179" y="454" text-anchor="middle" class="box-text">QueryService 入口</text>

  <rect x="356" y="390" width="184" height="96" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="448" y="421" text-anchor="middle" class="box-title">MDictDictionary</text>
  <text x="448" y="446" text-anchor="middle" class="box-text">逐条 LINK 跳转 + 资源重写</text>
  <text x="448" y="466" text-anchor="middle" class="box-text">限量 fallback + data URI 预算</text>

  <rect x="624" y="382" width="218" height="114" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="733" y="412" text-anchor="middle" class="box-title">WebView 外壳</text>
  <text x="733" y="436" text-anchor="middle" class="box-text">details + mdict-entry 直接渲染</text>
  <text x="733" y="456" text-anchor="middle" class="box-text">外部脚本注入 / nonce</text>
  <text x="733" y="476" text-anchor="middle" class="box-text">深色可读性修正 + 稳定高度/锚点</text>

  <path d="M266 438 H356" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M540 438 H624" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>

  <rect x="496" y="548" width="170" height="68" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="581" y="576" text-anchor="middle" class="box-title">MDictEntryScript</text>
  <text x="581" y="599" text-anchor="middle" class="box-text">音频 / 锚点 / 高度</text>

  <rect x="746" y="548" width="170" height="68" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="831" y="576" text-anchor="middle" class="box-title">MDictStyleScript</text>
  <text x="831" y="599" text-anchor="middle" class="box-text">按需启用 / 跟随系统</text>

  <path d="M733 286 C733 332 733 350 733 382" stroke="#8b5cf6" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="740" y="329" width="48" height="19" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="748" y="343" class="label">load js</text>
  <path d="M733 496 V520" stroke="#8b5cf6" stroke-width="1.8" fill="none"/>
  <path d="M733 520 H581 V548" stroke="#8b5cf6" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M733 520 H831 V548" stroke="#8b5cf6" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>

  <rect x="66" y="548" width="350" height="68" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="241" y="576" text-anchor="middle" class="box-title">MDictReader/</text>
  <text x="241" y="599" text-anchor="middle" class="box-text">reader、parser、search index 与 binary helpers</text>

  <path d="M733 280 C733 330 480 330 480 390" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="548" y="310" width="120" height="19" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="608" y="324" text-anchor="middle" class="label">初始化 MDX reader</text>
  <path d="M448 486 V520 H241 V548" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="328" y="502" width="44" height="19" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="340" y="516" class="label">lookup</text>

  <rect x="610" y="654" width="306" height="68" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="763" y="680" text-anchor="middle" class="box-title">共享 Utility / Dark Reader 4.9.128</text>
  <text x="763" y="703" text-anchor="middle" class="box-text">离线运行时，可由具体页面按需复用</text>
  <path d="M831 616 V654" stroke="#9333ea" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="835" y="625" width="76" height="19" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="873" y="639" text-anchor="middle" class="label">调用 auto API</text>

  <g transform="translate(66, 758)">
    <line x1="0" y1="8" x2="32" y2="8" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <text x="44" y="12" class="label">导入 / 加载</text>
    <line x1="154" y1="8" x2="186" y2="8" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <text x="198" y="12" class="label">查询 / 渲染</text>
    <line x1="322" y1="8" x2="354" y2="8" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
    <text x="366" y="12" class="label">依赖 / 脚本调用</text>
  </g>
</svg>
